name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test macro engine
        run: ./gradlew :core:test
      - name: Build APK
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: fader-macros-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk fader-macros.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest fader-macros.apk \
            --title "Fader Macros (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download fader-macros.apk on your Android device and open it to install."
